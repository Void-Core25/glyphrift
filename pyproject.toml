[project]
name = "glyphrift"
version = "0.0.1"
description = "A code graph that is honest about what it knows."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Void Core" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
glyphrift = "glyphrift.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glyphrift"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
